<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A6B"/>
      <stop offset="0.55" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="20" y="20" width="200" height="200" rx="48" fill="url(#bg)"/>
  <rect x="20" y="20" width="200" height="200" rx="48" fill="white" opacity="0.06"/>

  <!-- robot head -->
  <rect x="78" y="96" width="84" height="68" rx="20" fill="#ffffff"/>
  <!-- antenna -->
  <circle cx="120" cy="70" r="9" fill="#ffffff"/>
  <rect x="116" y="78" width="8" height="20" rx="4" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="102" cy="124" r="9" fill="url(#mark)"/>
  <circle cx="138" cy="124" r="9" fill="url(#mark)"/>
  <!-- smile -->
  <path d="M100 146 q20 18 40 0" stroke="url(#mark)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- headset ears -->
  <rect x="58" y="112" width="18" height="40" rx="9" fill="#ffffff"/>
  <rect x="164" y="112" width="18" height="40" rx="9" fill="#ffffff"/>
</svg>
